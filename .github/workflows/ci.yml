name: LANDER RIO - quality gate
on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check manifest, JSON and paths
        run: python3 scripts/verify_site.py
      - name: JavaScript syntax
        run: find site -name '*.js' -type f -print0 | xargs -0 -r -n1 node --check
      - name: TITAN Flagship structural and semantic regression tests
        run: python3 scripts/test_flagship.py
      - name: Binary, manifest tampering and complete-site metadata regression
        run: python3 scripts/test_integrity.py
      - name: ROX, transport, Revenue and integration safety tests
        run: node --experimental-strip-types --test scripts/*.test.cjs scripts/test_seo_metadata.cjs prototypes/rox-ai-v2/*.test.mjs prototypes/rox-ai-v2/preview-private/server.test.mjs revenue-intelligence/test-*.cjs
      - name: Read-only HTTP smoke tests
        run: python3 scripts/smoke_http.py

# IMPORTANT: No deploy job. Production stays on manual Netlify deploy.
