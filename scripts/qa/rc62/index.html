<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LANDER RIO — Revisão responsiva</title><style>*{box-sizing:border-box}body{margin:0;background:#242629;font:12px Arial;color:#fff}header{height:56px;display:flex;align-items:center;gap:12px;padding:8px 18px}button,select,input{font:12px Arial;padding:9px;background:#363b34;color:white;border:1px solid #748261}main{display:flex;align-items:flex-start;justify-content:center}iframe{display:block;flex:none;border:0;background:#0a0b0b;width:390px;height:844px}#report{position:fixed;right:5px;bottom:5px;max-width:240px;max-height:350px;overflow:auto;background:#222e;font:10px monospace;white-space:pre-wrap;padding:10px;z-index:10}#report[hidden]{display:none}#size{width:85px}label{white-space:nowrap}</style></head><body><header><strong>RC6.2 / QUALITY</strong><label>Largura <select id="size"><option>320</option><option>360</option><option selected>390</option><option>430</option><option>768</option><option>1280</option><option>1440</option></select></label><label>Altura <select id="height"><option>667</option><option>740</option><option selected>844</option><option>390</option></select></label><label>Página <select id="route"><option value="/">Home</option><option value="/atacado/">Atacado</option><option value="/varejo/">Varejo</option><option value="/treino/">Treino</option><option value="/dieta/">Dieta</option><option value="/enciclopedia/">Enciclopédia</option><option value="/conteudos/">Conteúdos</option><option value="/marcas/">Marcas</option></select></label><label>Seção <select id="section"><option value="inicio">Hero</option><option value="perfis">Comercial</option><option value="marcas">Marcas</option><option value="rox">ROX</option><option value="relacionamento">Relacionamento</option><option value="ferramentas">Ferramentas</option><option value="ciencia">Enciclopédia</option><option value="atendimento">Atendimento</option></select></label><label><input id="noscript" type="checkbox">Sem JS</label><button id="axe">Acessibilidade</button><button id="matrix">Testar larguras</button><button id="flows">Testar interações</button><button id="sweep" hidden>Auditar rotas</button><button id="capture">Preparar captura</button><span id="ready" hidden>Pronto</span><button id="audit">Verificar layout</button><button id="hide">Mostrar/ocultar relatório</button></header><main><iframe id="app" title="Site LANDER RIO em revisão" src="/"></iframe></main><output id="audit-state">Pronto</output><pre id="axe-report" hidden></pre><pre id="report" hidden></pre><script>
const frame=document.querySelector('#app'),report=document.querySelector('#report'),size=document.querySelector('#size'),route=document.querySelector('#route');
const history=[];
document.querySelector('#noscript').onchange=e=>{if(e.target.checked)frame.setAttribute('sandbox','allow-same-origin');else frame.removeAttribute('sandbox');frame.src='/';};
size.onchange=()=>{frame.style.width=size.value+'px';};route.onchange=()=>{frame.src=route.value;};document.querySelector('#section').onchange=e=>{frame.contentDocument.getElementById(e.target.value)?.scrollIntoView({behavior:'instant',block:'start'});};
document.querySelector('#capture').onclick=async()=>{document.querySelector('#ready').hidden=true;await Promise.allSettled([...frame.contentDocument.images].map(i=>{i.loading='eager';return i.decode()}));document.querySelector('#ready').hidden=false;};
document.querySelector('#hide').onclick=()=>report.hidden=!report.hidden;
document.querySelector('#audit').onclick=async()=>{await frame.contentDocument.fonts.ready;const d=frame.contentDocument,w=frame.contentWindow;const imgs=[...d.images],visible=[...d.querySelectorAll('a,button,input,select,summary')].filter(e=>e.getClientRects().length);const result={viewport:w.innerWidth,route:w.location.pathname,bodyWidth:d.documentElement.scrollWidth,clientWidth:d.documentElement.clientWidth,overflow:d.documentElement.scrollWidth>d.documentElement.clientWidth,h1:d.querySelectorAll('h1').length,brokenImages:imgs.filter(i=>i.complete&&i.naturalWidth===0).map(i=>i.getAttribute('src')),missingImageSizes:imgs.filter(i=>!i.hasAttribute('width')||!i.hasAttribute('height')).map(i=>i.getAttribute('src')),tinyTargets:visible.filter(e=>{let r=e.getBoundingClientRect();return r.width<24||r.height<24}).map(e=>(e.textContent||e.getAttribute('aria-label')||'').trim().slice(0,65)),sectionOrder:[...d.querySelectorAll('main>section[id]')].map(s=>s.id),heroActions:[...d.querySelectorAll('.hero-cta')].map(e=>({text:e.textContent.trim(),bottom:Math.round(e.getBoundingClientRect().bottom),width:Math.round(e.getBoundingClientRect().width)})),heroImage:{src:d.querySelector('.lfx-hero-photo img')?.currentSrc,width:d.querySelector('.lfx-hero-photo img')?.naturalWidth,height:d.querySelector('.lfx-hero-photo img')?.naturalHeight},logos:[...d.querySelectorAll('.lfx-hero-marks img')].map(i=>({alt:i.alt,loaded:i.naturalWidth>0,bottom:Math.round(i.getBoundingClientRect().bottom)}))};history.push(result);report.hidden=false;report.textContent=JSON.stringify(result,null,2);document.documentElement.dataset.qa=JSON.stringify(history);};
frame.onload=()=>{const st=frame.contentDocument.createElement('style');st.textContent='html{scrollbar-width:none}html::-webkit-scrollbar{width:0;height:0}';frame.contentDocument.head.appendChild(st)};
</script><script src="/__qa/quality.js"></script><pre id="matrix-report" hidden></pre><pre id="flow-report" hidden></pre><script src="/__qa/review.js"></script></body></html>
